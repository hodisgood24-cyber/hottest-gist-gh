/* ===== Bell tabs ===== */

/* ===== Chat media ===== */

.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));box-sizing:border-box;width:100%;gap:8px;margin:10px 0;background:#c08a4b;padding:10px;border-radius:16px;border:2px solid #92400e}
.hs{position:relative;min-width:0;aspect-ratio:1;border:0;border-radius:12px;background:rgba(255,255,255,.25);font-size:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hs:disabled{cursor:default}.hs:not(:disabled):hover{background:rgba(255,255,255,.5)}
.hs .hm{position:absolute;right:4px;bottom:2px;font-size:22px}
.hs.hot{background:rgba(239,68,68,.45)}.hs.cold{background:rgba(59,130,246,.4)}.hs.found{background:rgba(34,197,94,.6)}.hs.mine{outline:3px solid #fff}

.glob{display:grid;gap:12px;margin:10px 0}
.gcard{border-radius:18px;overflow:hidden;background:var(--card);border:1.5px solid var(--line)}
.gart{height:110px;background:linear-gradient(135deg,var(--ga,#444),var(--gb,#222))}.gart svg{width:100%;height:100%;display:block}
.gbody{padding:12px 14px 14px}.ghd{display:flex;align-items:center;gap:8px;justify-content:space-between}.ghd h3{margin:0;font-size:18px}

.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.gchips span{font-size:12px;font-weight:700;background:var(--bg);border-radius:99px;padding:4px 10px}

.gbub{margin-top:6px;background:var(--red);color:#fff;border:0;border-radius:99px;padding:7px 14px;font:inherit;font-weight:800;cursor:pointer}.gbub:disabled{opacity:.6}
.pen{position:relative}.psnd{position:absolute;right:2px;top:-30px;z-index:2;background:none;border:0;font-size:20px;cursor:pointer}

.gdock{margin:6px 0}.gch{width:100%;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:8px;font:inherit;font-weight:700;color:var(--text);cursor:pointer}

/* ===== Stories ===== */
#stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:4px;scrollbar-width:none}#stories::-webkit-scrollbar{display:none}

.stview .stbody{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stview{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.stview.paused .sthd,.stview.paused .stbars{opacity:.55}
.stbody img{-webkit-user-drag:none;width:100%;height:100%;object-fit:contain}
.sttxt{color:#fff;font:400 30px/1.2 var(--font-display);text-align:center;padding:30px;word-break:break-word}.sttxt.cap{position:absolute;left:0;right:0;bottom:70px;font:700 17px/1.3 inherit;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.stbars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
.stbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}.stbars b{display:block;height:100%;width:0;background:#fff}.stbars b.run{animation:stfill 5s linear forwards}
@keyframes stfill{to{width:100%}}
.sthd{position:absolute;top:18px;left:10px;right:10px;display:flex;align-items:center;gap:8px;color:#fff;z-index:3}.sthd .none{color:#ddd}.sthd .av{border:2px solid #fff}
.stx{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.stnav{position:absolute;top:70px;bottom:70px;width:40%;background:none;border:0;z-index:2;cursor:pointer}.stnav.l{left:0}.stnav.r{right:0}
.stdel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.6);color:#fff;border:1px solid #fff;border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
@media(min-width:700px){.stview{background:rgba(0,0,0,.85)}.stview .stbody,.stbars,.sthd{left:50%;right:auto;width:min(420px,100%);transform:translateX(-50%)}.stview .stbody{inset:0 auto 0 50%}}

/* ===== Play: penalty shootout ===== */
.vh2{font-size:16px;margin:16px 0 6px}
.pen{max-width:520px}
.pscore{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.pball.in{filter:drop-shadow(0 0 8px #fff)}
.pround{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin:10px 0 2px}
.pmsg{text-align:center;font-weight:800;font-size:16px;margin:8px 0}
.pbanner{text-align:center;font-weight:900;font-size:18px;border-radius:12px;padding:10px;margin:10px 0;transition:opacity .6s}
.pbanner.good{background:#1f8a4c;color:#fff}.pbanner.bad{background:#b3261e;color:#fff}.pbanner.fade{opacity:0;height:0;padding:0;margin:0;overflow:hidden}
.pwin{text-align:center;font:400 30px/1.1 var(--font-display);margin:14px 0}

// Little emojis float up when you react
function rxBurst(btn,e){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  // ripple ring
  var rg=el("span","rxring");rg.style.left=cx+"px";rg.style.top=cy+"px";document.body.appendChild(rg);setTimeout(function(){rg.remove()},700);
  // big emoji that pops up over the post
  var card=btn.closest&&btn.closest(".post,article,.card"),cr2=card?card.getBoundingClientRect():null;
  var bx=cr2?cr2.left+cr2.width/2:window.innerWidth/2,by=cr2?Math.max(110,Math.min(window.innerHeight-130,cr2.top+cr2.height/2)):window.innerHeight/2;
  var big=el("span","rxbig",e);big.style.left=bx+"px";big.style.top=by+"px";document.body.appendChild(big);setTimeout(function(){big.remove()},1000);
  // confetti of the same emoji flying out
  for(var i=0;i<14;i++){(function(i){var f=el("span","rxf",e);
    var a=(Math.PI*2*i/14)+Math.random()*.4,d=60+Math.random()*70;
    f.style.left=cx+"px";f.style.top=cy+"px";
    f.style.setProperty("--dx",Math.cos(a)*d+"px");f.style.setProperty("--dy",(Math.sin(a)*d-50)+"px");f.style.setProperty("--rot",(Math.random()*120-60)+"deg");
    f.style.animationDelay=(i*25)+"ms";f.style.fontSize=(16+Math.random()*16)+"px";
    document.body.appendChild(f);setTimeout(function(){f.remove()},1300+i*25)})(i)}
}
