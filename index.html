<style>
:root{
  --bg:#f2f2ee;--card:#ffffff;--text:#15140f;--muted:#5d5a51;--line:#dcdad1;
  --red:#c8102e;--on-red:#ffffff;--green:#006b3f;--on-green:#ffffff;--gold:#fcd116;--focus:#1a5fd0;

}

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font-body)}
h1,h2,p{margin:0}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.wrap{padding-block:24px 8px}
main.wrap{padding-block:8px 24px}
h1{font:400 clamp(32px,10vw,48px)/.95 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
h1 span{display:inline-block;background:var(--green);color:var(--on-green);padding:0 8px;border-radius:4px;margin-left:6px}
.sub{color:var(--muted);font-size:15px;margin-top:10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 0}

.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.post{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;scroll-margin-top:16px}
.post.flash{border-color:var(--green);border-width:2px}
.tagrow{display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}

.post h2{font:400 clamp(26px,7vw,34px)/1.1 var(--font-display);letter-spacing:.01em;margin:6px 0 4px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}

.photos.n1{grid-template-columns:1fr}

.photos.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:3/2}

.photos button{position:relative;padding:0;border:0;background:var(--line);cursor:zoom-in;min-width:0;display:block}
.photos.n1 img{display:block;width:100%;max-height:min(80vh,640px);object-fit:contain;background:var(--line)}
.photos.n2 button{aspect-ratio:1/1}
.photos.n2 img,.photos.n3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.text{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.linkbtn{display:inline-block;margin-top:14px;font-size:15px;font-weight:700;background:var(--red);color:var(--on-red);border-radius:6px;padding:10px 18px;text-decoration:none}
.row{display:flex;gap:4px 16px;margin-top:12px;align-items:center;flex-wrap:wrap}
.act{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}

.empty{text-align:center;color:var(--muted);padding:44px 8px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding-block:8px 48px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.act.on{color:var(--red)}
.com{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}

.none{color:var(--muted);font-size:14px;padding:6px 0}
.row{gap:10px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;font-weight:800;border-radius:999px;padding:8px 15px;cursor:pointer;position:relative;transition:transform .12s}
.pill:active{transform:scale(.93)}

.pill.on{border-color:#e11d48;color:#e11d48;background:rgba(225,29,72,.08)}

.fl{position:absolute;left:50%;top:0;font-size:18px;pointer-events:none;animation:fl .8s ease-out forwards}

.sb:hover{transform:translateY(-2px) scale(1.08)}.sb:active{transform:scale(.92)}
.sb svg{width:19px;height:19px;fill:#fff}
.sb.wa{background:#25D366}.sb.fb{background:#1877F2}.sb.xx{background:#000}.sb.tg{background:#229ED9}.sb.cp{background:#6b7280}.sb.nat{background:#e11d48}
.sb.cp svg,.sb.nat svg{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.pill.pop svg,.fl{animation:none}.sb,.pill{transition:none}}
.locked header,.locked main,.locked footer{display:none}
.who{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:700}
.who button{background:none;border:0;color:var(--red);font:inherit;font-weight:800;cursor:pointer;padding:0;text-decoration:underline}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate[hidden]{display:none}
.gc{width:100%;max-width:400px}
.gc h1{margin:0}
.gc .sub{margin:6px 0 20px}
.gc form{display:grid;gap:10px}
.gc input{font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%;box-sizing:border-box}
.gc .go{font:inherit;font-weight:800;font-size:16px;background:var(--red);color:var(--on-red);border:0;border-radius:8px;padding:13px;cursor:pointer}
.gc .go:disabled{opacity:.6}
.gc .lnk{background:none;border:0;color:var(--red);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;justify-self:start}
.gc .msg{font-size:14px;font-weight:700;min-height:20px;color:var(--red)}
.gc .msg.ok{color:#15803d}
.gc .tab{display:flex;gap:6px;margin-bottom:14px}
.gc .tab button{flex:1;font:inherit;font-weight:800;font-size:14px;padding:10px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.gc .tab button[aria-pressed=true]{background:var(--red);color:var(--on-red);border-color:var(--red)}
.gate{position:relative;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,rgba(206,17,38,.10),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(0,107,63,.12),transparent 60%),radial-gradient(80% 40% at 0% 90%,rgba(252,209,22,.16),transparent 60%)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;bottom:-40px;font-size:26px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}85%{opacity:.85}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.gc{position:relative;z-index:1;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.gc .hi{font-weight:800;font-size:20px;margin:4px 0 2px}
.gc .perks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
.gc .perk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:rgba(0,0,0,.04);font-size:12px;font-weight:800;text-align:center}
.gc .perk b{font-size:24px;line-height:1;display:inline-block;animation:wig 2.6s ease-in-out infinite}
.gc .perk:nth-child(2) b{animation-delay:.3s}.gc .perk:nth-child(3) b{animation-delay:.6s}.gc .perk:nth-child(4) b{animation-delay:.9s}
@keyframes wig{0%,70%,100%{transform:rotate(0) scale(1)}78%{transform:rotate(-12deg) scale(1.25)}86%{transform:rotate(10deg) scale(1.25)}94%{transform:rotate(-4deg) scale(1.1)}}
.gc .tagl{display:flex;gap:6px;justify-content:center;margin-top:16px}
.gc .tagl i{width:28px;height:5px;border-radius:3px;display:block}
@media (prefers-reduced-motion:reduce){.fx span{animation:none;opacity:.35;bottom:auto}.gc .perk b{animation:none}}
</style>
</head>

var SES=null;

  if(o&&o.access_token){SES={access_token:o.access_token,refresh_token:o.refresh_token,expires_at:o.expires_at||(Math.floor(Date.now()/1000)+(o.expires_in||3600)),user:o.user||(SES&&SES.user)||{}};ls("gh-ses",JSON.stringify(SES))}
  else{SES=null;ls("gh-ses","")}

  var o={method:method||"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+(tok||CFG.key),"Content-Type":"application/json"}};
  if(body)o.body=JSON.stringify(body);
  return fetch(CFG.url.replace(/\/$/,"")+"/auth/v1/"+path,o).then(function(r){
    return r.text().then(function(t){
      var j=null;try{j=t?JSON.parse(t):null}catch(e){}

function token(){
  if(!SES)return Promise.resolve(CFG.key);
  if(SES.expires_at-30>Math.floor(Date.now()/1000))return Promise.resolve(SES.access_token);
  return authCall("token?grant_type=refresh_token",{refresh_token:SES.refresh_token}).then(function(j){saveSes(j);return SES.access_token}).catch(function(e){saveSes(null);showGate("magic");throw e});
}
function api(path,body){
  return token().then(function(t){
    var o={method:body?"POST":"GET",headers:{apikey:CFG.key,Authorization:"Bearer "+t,"Content-Type":"application/json"}};
    if(body)o.body=JSON.stringify(body);
    return fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/"+path,o).then(function(r){
      if(!r.ok)throw new Error(r.status);
      return r.text().then(function(t2){return t2?JSON.parse(t2):null});
    });
  });
}
function field(type,ph,ac,label){var i=el("input");i.type=type;i.placeholder=ph;i.autocomplete=ac;i.setAttribute("aria-label",label||ph);return i}
function showGate(mode,note){
  document.body.classList.add("locked");
  var g=$("gate");g.hidden=false;g.textContent="";
  var c=el("div","gc");
  var h=el("h1");h.appendChild(document.createTextNode("Hottest Gist"));h.appendChild(el("span",null,"GH"));c.appendChild(h);
  var recovery=mode==="reset";
  var bg=el("div","fx");bg.setAttribute("aria-hidden","true");
  var em0=["\ud83d\udd25","\u2764\ufe0f","\ud83d\ude02","\ud83c\udfb6","\ud83c\udfa4","\ud83d\udcac","\ud83c\uddec\ud83c\udded","\ud83d\ude0d","\ud83c\udf89","\ud83d\udc83","\ud83e\udd41","\ud83d\udc4f"];
  em0.forEach(function(e,i){var sp=el("span",null,e);sp.style.left=((i*8.3+Math.random()*4)%94)+"%";sp.style.animationDuration=(9+Math.random()*7)+"s";sp.style.animationDelay=(-Math.random()*14)+"s";sp.style.fontSize=(20+Math.random()*16)+"px";bg.appendChild(sp)});
  g.appendChild(bg);
  c.appendChild(el("p","hi",recovery?"Almost there":(mode==="signup"?"Join the gist \ud83c\uddec\ud83c\udded":"Welcome to the gist \ud83d\udc4b")));
  c.appendChild(el("p","sub",recovery?"Choose a new password.":"Ghana's hottest music and entertainment news, all in one place."));
  if(!recovery){
    var pk=el("div","perks");
    [["\u2764\ufe0f","Like"],["\ud83d\udcac","Comment"],["\ud83d\ude02","Laugh"],["\ud83d\udd25","Share"]].forEach(function(x){var d=el("div","perk");d.appendChild(el("b",null,x[0]));d.appendChild(el("span",null,x[1]));pk.appendChild(d)});
    c.appendChild(pk);
  }
  var msg=el("div","msg",note||"");msg.setAttribute("role","status");
  if(note)msg.classList.add("ok");
  function say(t,ok){msg.textContent=t;msg.classList.toggle("ok",!!ok)}
  var signup=mode==="signup",magic=mode==="magic";
  if(!recovery){
    var tab=el("div","tab");
    [["magic","Email link"],["login","Password"],["signup","Sign up"]].forEach(function(x){var b=el("button",null,x[1]);b.type="button";b.setAttribute("aria-pressed",String(x[0]===(signup?"signup":magic?"magic":"login")));b.onclick=function(){showGate(x[0])};tab.appendChild(b)});
    c.appendChild(tab);
  }
  var f=el("form");
  var nm=(signup||magic)?field("text",magic?"Your name (for new accounts)":"Your name (shown on comments)","nickname","Your name"):null;if(nm)nm.maxLength=40;
  var em=recovery?null:field("email","Email","email");
  var pw=magic?null:field("password",recovery?"New password":(signup?"Create a password (6+ characters)":"Password"),signup||recovery?"new-password":"current-password");
  if(nm)f.appendChild(nm);if(em)f.appendChild(em);if(pw)f.appendChild(pw);
  var go=el("button","go",recovery?"Save password":(magic?"Continue with email":(signup?"Create my account":"Log in")));go.type="submit";f.appendChild(go);
  f.appendChild(msg);
  if(magic){f.appendChild(el("p","sub","We email you a link. Tap it and you're in. No password needed."))}
  if(!signup&&!recovery&&!magic){
    var fg=el("button","lnk","Forgot password?");fg.type="button";fg.onclick=function(){
      if(!em.value.trim()){say("Type your email above first.");em.focus();return}
      authCall("recover",{email:em.value.trim()}).then(function(){say("Check your email for a reset link.",true)}).catch(function(e){say(e.message)});
    };f.appendChild(fg);
  }
  f.onsubmit=function(e){
    e.preventDefault();say("");go.disabled=true;
    var done=function(){go.disabled=false};
    if(recovery){
      var rt=showGate.rt;
      authCall("user",{password:pw.value},"PUT",rt.access_token).then(function(u){
        saveSes({access_token:rt.access_token,refresh_token:rt.refresh_token,expires_in:rt.expires_in,user:u});
        history.replaceState(null,"",location.pathname);start();
      }).catch(function(er){done();say(er.message)});
    }else if(magic){
      var mn=nm.value.trim(),me=em.value.trim();if(!me){done();say("Please enter your email.");em.focus();return}
      var body={email:me,create_user:true};if(mn)body.data={name:mn};
      authCall("otp",body).then(function(){done();say("Check your email and tap the link to log in.",true)}).catch(function(er){done();say(er.message)});
    }else if(signup){
      var name=nm.value.trim();if(!name){done();say("Please enter your name.");nm.focus();return}
      authCall("signup",{email:em.value.trim(),password:pw.value,data:{name:name}}).then(function(j){
        if(j&&j.access_token){saveSes(j);start()}
        else{done();showGate("login","Account created. Check your email to confirm, then log in.")}
      }).catch(function(er){done();say(er.message)});
    }else{
      authCall("token?grant_type=password",{email:em.value.trim(),password:pw.value}).then(function(j){saveSes(j);start()}).catch(function(er){done();say(er.message)});
    }
  };
  c.appendChild(f);
  var fl=el("div","tagl");["#CE1126","#FCD116","#006B3F"].forEach(function(k){var i=document.createElement("i");i.style.background=k;fl.appendChild(i)});c.appendChild(fl);
  g.appendChild(c);
}
function logout(){
  var t=SES&&SES.access_token;saveSes(null);
  if(t)authCall("logout",null,"POST",t).catch(function(){});
  likeN={};comN={};showGate("magic");
}
function renderWho(){
  var w=$("who");if(!CFG||!SES){w.hidden=true;return}
  w.hidden=false;w.textContent="";w.appendChild(el("span",null,"Hi, "+myName()));
  var b=el("button",null,"Log out");b.type="button";b.onclick=logout;w.appendChild(b);
}
var likeN={},comN={},liked={};
try{liked=JSON.parse(ls("gh-liked")||"{}")||{}}catch(e){liked={}}
function paint(){
  var a=document.querySelectorAll("[data-like]");
  for(var i=0;i<a.length;i++){var id=a[i].getAttribute("data-like"),n=likeN[id]||0,on=!!liked[id];
    a[i].lastChild.textContent=(on?"Liked":"Like")+(n?" \u00b7 "+n:"");a[i].classList.toggle("on",on);a[i].setAttribute("aria-pressed",String(on))}
  var c=document.querySelectorAll("[data-com]");
  for(var j=0;j<c.length;j++){var n2=comN[c[j].getAttribute("data-com")]||0;c[j].lastChild.textContent="Comments"+(n2?" \u00b7 "+n2:"")}
}
function loadCounts(){
  if(!CFG)return;
  api("like_counts?select=post_id,n").then(function(r){(r||[]).forEach(function(x){likeN[x.post_id]=x.n});paint()}).catch(function(){});
  api("comment_counts?select=post_id,n").then(function(r){(r||[]).forEach(function(x){comN[x.post_id]=x.n});paint()}).catch(function(){});
}
function toggleLike(p){
  var on=!liked[p.id];
  if(on)liked[p.id]=1;else delete liked[p.id];
  likeN[p.id]=Math.max(0,(likeN[p.id]||0)+(on?1:-1));
  ls("gh-liked",JSON.stringify(liked));paint();
  if(on){var bt=document.querySelector('[data-like="'+p.id.replace(/"/g,"")+'"]');if(bt){bt.classList.remove("pop");void bt.offsetWidth;bt.classList.add("pop");burst(bt)}}
  api("rpc/toggle_like_auth",{p_post:p.id,p_on:on}).catch(function(){
    if(on)delete liked[p.id];else liked[p.id]=1;
    likeN[p.id]=Math.max(0,(likeN[p.id]||0)+(on?-1:1));
    ls("gh-liked",JSON.stringify(liked));paint();toast("Couldn't save your like");
  });
}
function fmtT(t){try{return new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function addComment(list,c){
  var d=el("div","cm"),b=el("b",null,c.name||"Fan");d.appendChild(b);d.appendChild(el("small",null,fmtT(c.created_at)));d.appendChild(el("p",null,c.text));list.appendChild(d);
}
function openComments(p,box){
  box.textContent="";
  var list=el("div");list.appendChild(el("div","none","Loading comments..."));box.appendChild(list);
  api("comments?post_id=eq."+encodeURIComponent(p.id)+"&order=created_at.asc&limit=100&select=name,text,created_at").then(function(r){
    list.textContent="";
    if(!r||!r.length)list.appendChild(el("div","none","No comments yet. Be the first."));
    else r.forEach(function(c){addComment(list,c)});
  }).catch(function(){list.textContent="";list.appendChild(el("div","none","Couldn't load comments right now."))});
  var f=el("form","cf");
  var tx=el("textarea");tx.maxLength=500;tx.rows=3;tx.placeholder="Write a comment";tx.setAttribute("aria-label","Comment");
  var bt=el("button","","Post comment");bt.type="submit";
  f.appendChild(tx);f.appendChild(bt);
  f.onsubmit=function(e){
    e.preventDefault();
    var name=myName(),text=tx.value.trim();
    if(!text){tx.focus();return}
    bt.disabled=true;
    api("rpc/add_comment_auth",{p_post:p.id,p_text:text}).then(function(){
      var none=list.querySelector(".none");if(none)list.removeChild(none);
      addComment(list,{name:name,text:text,created_at:new Date().toISOString()});
      comN[p.id]=(comN[p.id]||0)+1;paint();tx.value="";bt.disabled=false;
    }).catch(function(){bt.disabled=false;toast("Couldn't post. Wait a moment, or log in again.")});
  };
  box.appendChild(f);
}
function card(p){
  var a=el("article","post");a.id="post-"+p.id;
  var head=el("div","tagrow");head.appendChild(el("span","tag",p.cat||"News"));
  if(p.pin)head.appendChild(el("span","pin","Pinned"));
  a.appendChild(head);
  a.appendChild(el("h2",null,p.title));
  a.appendChild(el("div","meta",(p.by?"By "+p.by+" · ":"")+fmt(p.ts)));
  var imgs=(Array.isArray(p.images)?p.images:[]).slice(0,3);
  if(imgs.length){
    var g=el("div","photos n"+imgs.length);
    imgs.forEach(function(s,i){
      var b=el("button");b.type="button";b.setAttribute("aria-label","View photo "+(i+1));
      var im=document.createElement("img");im.src=s;im.alt=p.title+", photo "+(i+1);im.loading="lazy";
      b.appendChild(im);b.onclick=function(){openLb(s,im.alt)};g.appendChild(b);
    });
    a.appendChild(g);
  }
  if(p.body)a.appendChild(el("p","text",p.body));
  var l=safeLink(p.link);
  if(l){var la=el("a","linkbtn",linkLabel(l));la.href=l;la.target="_blank";la.rel="noopener noreferrer";a.appendChild(la)}
  var row=el("div","row");
  var box=null;
  if(CFG){
    var lk=pill("heart","Like");lk.setAttribute("data-like",p.id);lk.onclick=function(){toggleLike(p)};row.appendChild(lk);
    var cm=pill("chat","Comments");cm.setAttribute("data-com",p.id);
    box=el("div","com");box.hidden=true;
    cm.onclick=function(){if(box.hidden){box.hidden=false;openComments(p,box)}else{box.hidden=true}};
    row.appendChild(cm);
  }
  var sh=el("div","shr");sh.appendChild(el("small",null,"Share"));
  var url=permalink(p);
  if(navigator.share){var nt=sbtn("nat","nat","Share","button");nt.onclick=function(){navigator.share({title:p.title,text:p.title,url:url}).catch(function(){})};sh.appendChild(nt)}
  var wa=sbtn("wa","wa","Share on WhatsApp");wa.href="https://wa.me/?text="+encodeURIComponent(shareText(p));sh.appendChild(wa);
  var fb=sbtn("fb","fb","Share on Facebook");fb.href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url);sh.appendChild(fb);
  var xx=sbtn("xx","xx","Share on X");xx.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(p.title)+"&url="+encodeURIComponent(url);sh.appendChild(xx);
  var tg=sbtn("tg","tg","Share on Telegram");tg.href="https://t.me/share/url?url="+encodeURIComponent(url)+"&text="+encodeURIComponent(p.title);sh.appendChild(tg);
  var cp=sbtn("cp","cp","Copy link","button");cp.onclick=function(){copyText(url)};sh.appendChild(cp);
  row.appendChild(sh);
  a.appendChild(row);
  if(box)a.appendChild(box);
  return a;
}

function renderChips(){
  var cats=[];all.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat)});
  var c=$("chips");c.textContent="";c.hidden=cats.length<2;
  ["All"].concat(cats).forEach(function(n){
    var b=el("button","chip",n);b.type="button";b.setAttribute("aria-pressed",String(n===filter));
    b.onclick=function(){filter=n;renderChips();render()};c.appendChild(b);
  });
}

function render(){
  var f=$("feed");f.textContent="";
  var list=all.filter(function(p){
    return (filter==="All"||p.cat===filter)&&((p.title||"")+" "+(p.body||"")+" "+(p.by||"")).toLowerCase().indexOf(term)>-1;
  }).sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||(b.ts||0)-(a.ts||0)});
  if(!list.length){f.appendChild(el("div","empty",all.length?"Nothing matches that search.":"No posts yet. Check back soon."));return}
  list.forEach(function(p){f.appendChild(card(p))});
  paint();
}

$("q").oninput=function(e){term=e.target.value.toLowerCase();render()};
function start(){
  document.body.classList.remove("locked");$("gate").hidden=true;
  renderWho();renderChips();render();loadCounts();
  $("q").hidden=!all.length;
  var h=location.hash.slice(1);
  if(h&&!/access_token|type=/.test(h)){var t=document.getElementById("post-"+h);if(t){t.classList.add("flash");t.scrollIntoView()}}
}
(function boot(){
  if(!CFG){start();return}
  var hs=location.hash.slice(1);
  if(/type=recovery/.test(hs)&&/access_token=/.test(hs)){
    var q=new URLSearchParams(hs);
    showGate.rt={access_token:q.get("access_token"),refresh_token:q.get("refresh_token"),expires_in:+q.get("expires_in")||3600};
    showGate("reset");return;
  }
  if(/access_token=/.test(hs)&&!/type=recovery/.test(hs)){
    var q2=new URLSearchParams(hs),at=q2.get("access_token");
    authCall("user",null,"GET",at).then(function(u){
      saveSes({access_token:at,refresh_token:q2.get("refresh_token"),expires_in:+q2.get("expires_in")||3600,user:u});
      history.replaceState(null,"",location.pathname);start();
    }).catch(function(){history.replaceState(null,"",location.pathname);showGate("magic","That link expired. Request a new one.")});
    return;
  }
  if(SES)start();else showGate("magic");
})();
})();
</script>
