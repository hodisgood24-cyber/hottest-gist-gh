  else head.appendChild(el("span","tag",p.cat||"News"));

  a.appendChild(head);
  if(!p.fan)a.appendChild(el("h2",null,p.title));
  a.appendChild(el("div","meta",(p.by&&!p.fan?"By "+p.by+" · ":"")+fmt(p.ts)));
  var imgs=(Array.isArray(p.images)?p.images:[]).slice(0,3);

    var g=el("div","photos n"+imgs.length);

      var im=document.createElement("img");im.src=s;im.alt=p.title+", photo "+(i+1);im.loading="lazy";
      b.appendChild(im);b.onclick=function(){openLb(s,im.alt)};g.appendChild(b);
    });

  }
  if(p.body)a.appendChild(el("p","text",p.body));
  var l=safeLink(p.link);
  if(l){var la=el("a","linkbtn",linkLabel(l));la.href=l;la.target="_blank";la.rel="noopener noreferrer";a.appendChild(la)}
  var row=el("div","row");
  var box=null;
  if(CFG){
    var lk=pill("heart","Like");lk.setAttribute("data-like",p.id);lk.onclick=function(){toggleLike(p)};row.appendChild(lk);
    var cm=pill("chat","Comments");cm.setAttribute("data-com",p.id);
    box=el("div","com");box.hidden=true;
    cm.onclick=function(){if(box.hidden){box.hidden=false;openComments(p,box)}else{box.hidden=true}};
    row.appendChild(cm);
    var rxw=el("div","rxw");
    R.forEach(function(r){
      var rb2=el("button","rx");rb2.type="button";rb2.setAttribute("data-rx",p.id+"|"+r[0]);rb2.setAttribute("data-e",r[1]);rb2.setAttribute("aria-label","React "+r[0]);rb2.textContent=r[1];
      rb2.onclick=function(){toggleReaction(p,r[0]);rb2.classList.remove("pop2");void rb2.offsetWidth;rb2.classList.add("pop2")};rxw.appendChild(rb2);
    });
    row.appendChild(rxw);
  }
  var pl=null,emb=embedUrl(l);
  if(emb){
    var pp=pill("play","Play");pl=el("div","player");pl.hidden=true;
    pp.onclick=function(){
      if(pl.hidden){pl.hidden=false;buildPlayer(pl,emb)}
      else{pl.hidden=true;pl.textContent=""}
    };
    row.appendChild(pp);
  }
  var sv=pill("save",saved[p.id]?"Saved":"Save");sv.classList.toggle("on",!!saved[p.id]);sv.onclick=function(){toggleSave(p,sv)};row.appendChild(sv);
  if(p.fan&&SES){
    if(SES.user&&SES.user.id===p.fan.uid){var dl=el("button","rl","Delete");dl.type="button";dl.onclick=function(){if(confirm("Delete this post?"))api("rpc/delete_fan_post",{p_id:p.fanId}).then(function(){a.remove();toast("Deleted")}).catch(function(){toast("Couldn't delete")})};row.appendChild(dl)}
    else{var rf=el("button","rl","Report");rf.type="button";rf.onclick=function(){reportItem("fan",p.fanId,rf)};row.appendChild(rf)}
  }
  var cdv=countdown(p);if(cdv)row.appendChild(el("span","cd",cdv));
  var sh=el("div","shr");sh.appendChild(el("small",null,"Share"));
  var url=permalink(p);
  if(navigator.share){var nt=sbtn("nat","nat","Share","button");nt.onclick=function(){navigator.share({title:p.title,text:p.title,url:url}).catch(function(){})};sh.appendChild(nt)}
  var wa=sbtn("wa","wa","Share on WhatsApp");wa.href="https://wa.me/?text="+encodeURIComponent(shareText(p));sh.appendChild(wa);
  var fb=sbtn("fb","fb","Share on Facebook");fb.href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url);sh.appendChild(fb);
  var xx=sbtn("xx","xx","Share on X");xx.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(p.title)+"&url="+encodeURIComponent(url);sh.appendChild(xx);
  var tg=sbtn("tg","tg","Share on Telegram");tg.href="https://t.me/share/url?url="+encodeURIComponent(url)+"&text="+encodeURIComponent(p.title);sh.appendChild(tg);
  var cp=sbtn("cp","cp","Copy link","button");cp.onclick=function(){copyText(url)};sh.appendChild(cp);
  row.appendChild(sh);
  a.appendChild(row);
  if(pl)a.appendChild(pl);
  if(box)a.appendChild(box);
  return a;
}

function renderChips(){
  var cats=[];all.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat)});
  var c=$("chips");c.textContent="";c.hidden=cats.length<2&&!savedCount();
  ["All"].concat(savedCount()?["\u2605 Saved"]:[]).concat(cats).forEach(function(n){
    var b=el("button","chip",n);b.type="button";b.setAttribute("aria-pressed",String(n===filter));
    b.onclick=function(){filter=n;renderChips();render()};c.appendChild(b);
  });
}

function render(){
  var f=$("feed");f.textContent="";
  var list=all.filter(function(p){
    return (filter==="All"||(filter==="\u2605 Saved"?saved[p.id]:p.cat===filter))&&((p.title||"")+" "+(p.body||"")+" "+(p.by||"")).toLowerCase().indexOf(term)>-1;
  }).sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||(b.ts||0)-(a.ts||0)});
  if(!list.length){f.appendChild(el("div","empty",all.length?"Nothing matches that search.":"No posts yet. Check back soon."));return}
  list.forEach(function(p){f.appendChild(card(p))});
  paint();
}

$("q").oninput=function(e){term=e.target.value.toLowerCase();render()};
var setOpen=false;
function applyPref(attr,key,val,reset){
  var d=document.documentElement;
  if(reset)d.removeAttribute(attr);else d.setAttribute(attr,val);
  ls(key,reset?"":val);
}
function seg(opts,cur,on){
  var w=el("div","seg");
  opts.forEach(function(o){var b=el("button",null,o[1]);b.type="button";b.setAttribute("aria-pressed",String(o[0]===cur));b.onclick=function(){on(o[0]);buildSettings()};w.appendChild(b)});
  return w;
}
function buildSettings(){
  var p=$("sp");p.textContent="";
  var t=document.documentElement.getAttribute("data-theme")||"auto";
  p.appendChild(el("h3",null,"Colour"));
  p.appendChild(seg([["light","\u2600\ufe0f White"],["dark","\ud83c\udf19 Black"],["auto","Auto"]],t,function(v){if(v==="auto")applyPref("data-theme","gh-theme","",true);else applyPref("data-theme","gh-theme",v)}));
  var z=document.documentElement.getAttribute("data-size")||"md";
  p.appendChild(el("h3",null,"Text size"));
  p.appendChild(seg([["sm","A-"],["md","A"],["lg","A+"],["xl","A++"]],z,function(v){if(v==="md")applyPref("data-size","gh-size","",true);else applyPref("data-size","gh-size",v)}));
  var mo=document.documentElement.getAttribute("data-motion")!=="off";
  p.appendChild(el("h3",null,"Animations"));
  p.appendChild(seg([["on","On"],["off","Off"]],mo?"on":"off",function(v){if(v==="on")applyPref("data-motion","gh-motion","",true);else applyPref("data-motion","gh-motion","off")}));
  if(CFG&&SES){
    p.appendChild(el("h3",null,"Account"));
    p.appendChild(el("div","who2","Signed in as "+myName()+(SES.user&&SES.user.email?" ("+SES.user.email+")":"")));
    var mb=badgesFor(SES.user&&SES.user.id);p.appendChild(el("div","who2",mb?"Your badges: "+mb:"Your badges: comment on a post to earn your first one"));
    var nm=el("div","nm");var ni=el("input");ni.maxLength=40;ni.value=myName();ni.setAttribute("aria-label","Display name");
    var sv=el("button",null,"Save");sv.type="button";
    sv.onclick=function(){
      var v=ni.value.trim();if(!v){ni.focus();return}
      token().then(function(tk){return authCall("user",{data:{name:v}},"PUT",tk)}).then(function(u){saveSes({access_token:SES.access_token,refresh_token:SES.refresh_token,expires_at:SES.expires_at,user:u});renderWho();toast("Name updated");var me=cr[SES.user.id];api("rpc/save_profile",{p_name:v,p_bio:me?me.bio:"",p_avatar:null}).then(function(){if(me)me.name=v}).catch(function(){})}).catch(function(){toast("Couldn't update name")});
    };
    nm.appendChild(ni);nm.appendChild(sv);p.appendChild(nm);
    var mp=el("button","item","\ud83d\udc64 My profile");mp.type="button";mp.onclick=function(){closeSettings();openProfile(SES.user.id)};p.appendChild(mp);
    var sw=el("button","item","\ud83d\udd04 Switch account");sw.type="button";sw.onclick=function(){closeSettings();logout()};p.appendChild(sw);
    if(SES.user&&SES.user.email){var rs=el("button","item","\ud83d\udd11 Email me a password reset link");rs.type="button";rs.onclick=function(){authCall("recover",{email:SES.user.email}).then(function(){toast("Reset link sent. Check your email")}).catch(function(e){toast(/rate|limit/i.test(e.message)?"Too many emails. Try later":"Couldn't send")})};p.appendChild(rs)}
    var lo=el("button","item danger","Log out");lo.type="button";lo.onclick=function(){closeSettings();logout()};p.appendChild(lo);
  }
  if(CFG&&SES){
    p.appendChild(el("h3",null,"Updates"));
    var sb=el("button","item",subscribed?"\ud83d\udd14 Subscribed to email updates (tap to stop)":"\ud83d\udd14 Email me the hottest gist");sb.type="button";
    sb.onclick=function(){var want=!subscribed;api("rpc/subscribe_auth",{p_on:want}).then(function(){subscribed=want;toast(want?"You're subscribed!":"Unsubscribed");buildSettings()}).catch(function(){toast("Couldn't update that")})};p.appendChild(sb);
    if(isAdm){var ad=el("a","item","\ud83d\udee0\ufe0f Admin page");ad.href="/admin.html";p.appendChild(ad)}
  }
  p.appendChild(el("h3",null,"More"));
  var sh=el("button","item","\ud83d\udce4 Share this site");sh.type="button";
  sh.onclick=function(){var u=location.origin+location.pathname;if(navigator.share)navigator.share({title:"Hottest Gist GH",text:"Fresh music, movies and culture from Ghana",url:u}).catch(function(){});else copyText(u)};p.appendChild(sh);
  var ins=el("button","item","\ud83d\udcf2 Install the app");ins.type="button";
  ins.onclick=function(){if(deferred){deferred.prompt();deferred=null}else toast("iPhone: tap Share, then Add to Home Screen. Android: browser menu, then Install app.")};p.appendChild(ins);
  if(CFG&&CFG.whatsapp){var wc=el("a","item","\ud83d\udce2 Join our WhatsApp channel");wc.href=CFG.whatsapp;wc.target="_blank";wc.rel="noopener noreferrer";p.appendChild(wc)}
  var up=el("button","item","\u2b06\ufe0f Back to top");up.type="button";up.onclick=function(){closeSettings();window.scrollTo({top:0,behavior:"smooth"})};p.appendChild(up);

function openSettings(){setOpen=true;buildSettings();$("sp").hidden=false;$("gear").setAttribute("aria-expanded","true")}
function closeSettings(){setOpen=false;$("sp").hidden=true;$("gear").setAttribute("aria-expanded","false")}
$("gear").onclick=function(e){e.stopPropagation();setOpen?closeSettings():openSettings()};
document.addEventListener("click",function(e){if(setOpen&&e.target.isConnected&&!$("sp").contains(e.target)&&e.target!==$("gear")&&!$("gear").contains(e.target))closeSettings()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&setOpen){closeSettings();$("gear").focus()}});
function start(){
  document.body.classList.remove("locked");$("gate").hidden=true;
  renderWho();buildTabs();setView(viewName);renderChips();render();renderPolls();loadCounts();if(CFG&&SES)loadRemote();renderExtras();
  var wa=$("wach");wa.textContent="";
  if(CFG&&CFG.whatsapp&&!document.querySelector(".wfab")){var wl=el("a","wfab");wl.href=CFG.whatsapp;wl.target="_blank";wl.rel="noopener noreferrer";wl.setAttribute("aria-label","Join our WhatsApp channel");wl.appendChild(svg("wa"));wl.appendChild(el("span",null,"Join our channel"));document.body.appendChild(wl)}
  $("q").hidden=!all.length;
  var h=location.hash.slice(1);
  if(/^u-[0-9a-f-]{36}$/.test(h)&&CFG&&SES){openProfile(h.slice(2));return}
  if(h&&!/access_token|type=/.test(h)){var t=document.getElementById("post-"+h);if(t){t.classList.add("flash");t.scrollIntoView()}}
}
(function boot(){
  if(!CFG){start();return}
  var hs=location.hash.slice(1);
  if(/type=recovery/.test(hs)&&/access_token=/.test(hs)){
    var q=new URLSearchParams(hs);
    showGate.rt={access_token:q.get("access_token"),refresh_token:q.get("refresh_token"),expires_in:+q.get("expires_in")||3600};
    showGate("reset");return;
  }
  if(/access_token=/.test(hs)&&!/type=recovery/.test(hs)){
    var q2=new URLSearchParams(hs),at=q2.get("access_token");
    authCall("user",null,"GET",at).then(function(u){
      saveSes({access_token:at,refresh_token:q2.get("refresh_token"),expires_in:+q2.get("expires_in")||3600,user:u});
      history.replaceState(null,"",location.pathname);start();
    }).catch(function(){history.replaceState(null,"",location.pathname);showGate("magic","That link expired. Request a new one.")});
    return;
  }
  if(SES)start();else showGate("signup");
})();
})();
