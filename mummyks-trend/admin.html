<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shop admin · MummyK’s Trend</title>
<link rel="icon" href="/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDE1D1;--surface:#F8F1E6;--ink:#17110D;--muted:#6A5B4B;--gold:#9C7424;--goldhi:#C99A3B;--line:#D8C7AE;--red:#B3261E;--green:#1f7a45}
@media (prefers-color-scheme:dark){:root{--bg:#120D0A;--surface:#1E1713;--ink:#F3E8D6;--muted:#B9A88F;--gold:#D4A94A;--goldhi:#E6BD5E;--line:#3A2E24;--red:#FF8A80;--green:#5fd08f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Jost,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;line-height:1.1}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0}
header img{width:44px;height:44px;border-radius:10px;vertical-align:middle;margin-right:10px}
header h1{font-size:24px;display:flex;align-items:center}
#hdr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#hdr .btn,#hdr button{padding:7px 12px;font-size:14px}
button,.btn{font:500 15px Jost,sans-serif;border-radius:4px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--ink)}
button.red{background:transparent;color:var(--red);border-color:var(--red)}
button:disabled{opacity:.55;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tabs button{background:var(--surface);color:var(--ink);border-color:var(--line);border-radius:999px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;margin:12px 0 5px}
input,select,textarea{width:100%;font:400 16px Jost,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;margin:12px 0 0}
.chk input{width:auto}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.msg{min-height:1.4em;margin-top:10px}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.pr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr img,.pr .ph{width:56px;height:68px;object-fit:cover;object-position:top;border-radius:6px;background:var(--line);flex:none}
.pr .t{flex:1;min-width:0}.pr .t b{display:block;overflow-wrap:anywhere}.pr .t small{color:var(--muted)}
.pr .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pr .acts button,.pr .acts a{padding:7px 12px;font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:72px;height:88px;object-fit:cover;object-position:top;border-radius:6px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;padding:0;font-size:14px;line-height:1;background:var(--red);border-color:var(--red);color:#fff}
.order{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.order.new{border-color:var(--goldhi);box-shadow:0 0 0 2px rgba(201,154,59,.25)}
.order .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.order ul{margin:8px 0;padding-left:18px}
.order .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.order select{width:auto}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.badge{background:var(--goldhi);color:#17110D;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:500;margin-left:4px}
.login{max-width:420px;margin:40px auto}
.login img{width:90px;border-radius:16px;display:block;margin:0 auto 12px}
.login h2{text-align:center;font-size:32px;margin-bottom:6px}
.login p{text-align:center;color:var(--muted);margin:0 0 10px}
.login button{width:100%;margin-top:14px}
.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:6px 0;width:auto!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font:700 26px "Cormorant Garamond",serif;color:var(--gold)}
.stats small{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><img src="/img/logo.jpg" alt="">Shop admin</h1><div id="hdr"></div></header>
  <div id="app"></div>
</div>
<script src="config.js"></script>
<script>
(function(){
const CFG=window.SHOP_CFG||{};const BASE=(CFG.url||"").replace(/\/$/,"");
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
let SES=null;try{SES=JSON.parse(ls("mk-admin")||"null")}catch(e){}
function save(j){if(j&&j.access_token){SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(SES&&SES.email)||""};ls("mk-admin",JSON.stringify(SES))}else{SES=null;ls("mk-admin",null)}}
function auth(path,body,method,tok){return fetch(BASE+"/auth/v1/"+path,{method:method||"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+(tok||CFG.key),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Something went wrong");return j}))}
function token(){
  if(!SES)return Promise.reject(new Error("login"));
  if(SES.expires_at-60>Date.now()/1000)return Promise.resolve(SES.access_token);
  return auth("token?grant_type=refresh_token",{refresh_token:SES.refresh_token}).then(j=>{save(j);return SES.access_token}).catch(e=>{save(null);showLogin("Please log in again.");throw e});
}
function api(path,body,method){
  return token().then(t=>fetch(BASE+"/rest/v1/"+path,{method:method||(body?"POST":"GET"),headers:{apikey:CFG.key,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}))
    .then(r=>r.text().then(x=>{const j=x?JSON.parse(x):null;if(!r.ok)throw new Error((j&&j.message)||("Error "+r.status));return j}));
}
let S={},P=[],O=[],V=[],tab="orders";
function money(n){if(n==null||n==="")return"–";return (S.currency||"")+" "+Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function wa(num,text){return"https://wa.me/"+String(num).replace(/\D/g,"").replace(/^0/,"233")+(text?"?text="+encodeURIComponent(text):"")}

function showLogin(note){
  $("hdr").textContent="";const a=$("app");a.textContent="";
  const c=el("div","login card");const im=el("img");im.src="/img/logo.jpg";im.alt="";c.appendChild(im);
  c.appendChild(el("h2",null,"MummyK’s Trend"));c.appendChild(el("p",null,"Log in to manage your shop."));
  let mode="login";
  const f=el("form");const em=el("input");em.type="email";em.autocomplete="email";em.placeholder="Email";em.setAttribute("aria-label","Email");
  const pw=el("input");pw.type="password";pw.autocomplete="current-password";pw.placeholder="Password";pw.setAttribute("aria-label","Password");pw.style.marginTop="10px";
  const go=el("button",null,"Log in");go.type="submit";const msg=el("p","msg",note||"");msg.setAttribute("role","status");
  const sw=el("button","lnk","First time? Create your password");sw.type="button";
  const fg=el("button","lnk","Forgot password?");fg.type="button";
  sw.onclick=()=>{mode=mode==="login"?"signup":"login";go.textContent=mode==="login"?"Log in":"Create account";sw.textContent=mode==="login"?"First time? Create your password":"Have a password? Log in";pw.autocomplete=mode==="login"?"current-password":"new-password";pw.placeholder=mode==="login"?"Password":"Choose a password (6+ characters)"};
  fg.onclick=()=>{if(!em.value.trim()){msg.textContent="Type your email first.";msg.className="msg err";return}auth("recover",{email:em.value.trim()}).then(()=>{msg.textContent="Check your email for a reset link.";msg.className="msg ok"}).catch(e=>{msg.textContent=e.message;msg.className="msg err"})};
  f.onsubmit=e=>{e.preventDefault();go.disabled=true;msg.textContent="";
    const p=mode==="login"?auth("token?grant_type=password",{email:em.value.trim(),password:pw.value}):auth("signup",{email:em.value.trim(),password:pw.value,data:{name:"MummyK"}});
    p.then(j=>{go.disabled=false;if(j.access_token){save(j);boot()}else{msg.textContent="Account created. Check your email to confirm, then log in.";msg.className="msg ok";sw.click()}}).catch(er=>{go.disabled=false;msg.textContent=er.message;msg.className="msg err"})};
  f.append(em,pw,go,msg);c.append(f,sw,el("br"),fg);a.appendChild(c);
}
function header(){const h=$("hdr");h.textContent="";const v=el("a","btn alt","View shop");v.href="/";v.target="_blank";const o=el("button","alt","Log out");o.type="button";o.onclick=()=>{const t=SES&&SES.access_token;save(null);if(t)auth("logout",null,"POST",t).catch(()=>{});showLogin()};h.append(v,o)}
function loadAll(){return Promise.all([
  api("shop_settings?select=key,value&key=eq.shop").then(r=>{S=(r&&r[0]&&r[0].value)||{}}),
  api("shop_products?select=*&order=featured.desc,sort.asc,created_at.desc").then(r=>{P=r||[]}),
  api("rpc/shop_list_orders",{}).then(r=>{O=r||[]}),
  api("rpc/shop_list_vip",{}).then(r=>{V=r||[]})])}
function boot(){
  if(!CFG.url){$("app").textContent="Shop database not set up.";return}
  if(!SES){showLogin();return}
  $("app").textContent="Loading…";
  api("rpc/is_shop_admin",{}).then(ok=>{
    if(ok!==true){header();const a=$("app");a.textContent="";const c=el("div","card");c.appendChild(el("h3",null,"Not a shop admin yet"));c.appendChild(el("p",null,"You're logged in as "+(SES.email||"this account")+", but it isn't on the shop admin list. Ask whoever set up the shop to add this email."));a.appendChild(c);return}
    header();return loadAll().then(render);
  }).catch(e=>{if(e.message!=="login"){$("app").textContent="Couldn't load: "+e.message+". Did you run setup-shop.sql?"}});
}
function render(){
  const a=$("app");a.textContent="";
  const st=el("div","stats");const nNew=O.filter(o=>o.status==="new").length;
  [[nNew,"New orders"],[P.length,"Products"],[V.length,"VIP members"]].forEach(([n,t])=>{const d=el("div");d.appendChild(el("b",null,String(n)));d.appendChild(el("small",null,t));st.appendChild(d)});a.appendChild(st);
  const tb=el("div","tabs");[["orders","Orders"],["products","Products"],["add","+ Add product"],["vip","VIP list"],["settings","Shop settings"]].forEach(([k,t])=>{const b=el("button",null,t);b.type="button";b.setAttribute("aria-pressed",String(k===tab));if(k==="orders"&&nNew){b.appendChild(el("span","badge",String(nNew)))}b.onclick=()=>{tab=k;editing=null;render()};tb.appendChild(b)});a.appendChild(tb);
  const box=el("div");a.appendChild(box);
  ({orders:renderOrders,products:renderProducts,add:renderForm,vip:renderVip,settings:renderSettings})[tab](box);
}
const STATUS=[["new","New"],["confirmed","Confirmed"],["paid","Paid"],["sent","Sent / ready"],["done","Completed"],["cancelled","Cancelled"]];
function renderOrders(box){
  if(!O.length){box.appendChild(el("p","empty","No orders yet. When customers send an order from the shop, it shows here."));return}
  O.forEach(o=>{const d=el("div","order"+(o.status==="new"?" new":""));
    const h=el("div","h");h.appendChild(el("b",null,"#"+o.id+" · "+o.name));h.appendChild(el("small",null,new Date(o.created_at).toLocaleString()));d.appendChild(h);
    const ul=el("ul");(o.items||[]).forEach(i=>ul.appendChild(el("li",null,i.qty+" × "+i.name+(i.size?" (Size "+i.size+")":"")+(i.color?" – "+i.color:"")+(i.price!=null?" · "+money(i.price*i.qty):""))));d.appendChild(ul);
    d.appendChild(el("div",null,"Total: "+money(o.total)+" · "+(o.delivery==="delivery"?"Delivery to: "+o.address:"Pickup")));
    if(o.note)d.appendChild(el("div",null,"Note: "+o.note));
    d.appendChild(el("div",null,"WhatsApp: "+o.phone));
    const ac=el("div","acts");const sel=el("select");sel.setAttribute("aria-label","Order status");STATUS.forEach(([v,t])=>{const op=el("option",null,t);op.value=v;if(v===o.status)op.selected=true;sel.appendChild(op)});
    sel.onchange=()=>{api("rpc/shop_set_order_status",{p_id:o.id,p_status:sel.value}).then(()=>{o.status=sel.value;render()}).catch(e=>alert(e.message))};
    const w=el("a","btn","Message customer");w.href=wa(o.phone,"Hi "+o.name+", thank you for your order #"+o.id+" with MummyK’s Trend. ");w.target="_blank";w.rel="noopener";
    ac.append(sel,w);d.appendChild(ac);box.appendChild(d)});
}
let editing=null;
function renderProducts(box){
  const c=el("div","card");
  if(!P.length)c.appendChild(el("p","empty","No products yet. Tap “+ Add product”."));
  P.forEach(p=>{const r=el("div","pr");const im=(p.images||[])[0];if(im){const i=el("img");i.src=im.startsWith("img/")?"/"+im:im;i.alt="";r.appendChild(i)}else r.appendChild(el("div","ph"));
    const t=el("div","t");t.appendChild(el("b",null,p.name));t.appendChild(el("small",null,p.category+" · "+(p.price!=null?money(p.price):"No price")+(p.in_stock?"":" · SOLD OUT")+(p.featured?" · New":"")));r.appendChild(t);
    const ac=el("div","acts");const e=el("button","alt","Edit");e.type="button";e.onclick=()=>{editing=p;tab="add";render()};
    const so=el("button","alt",p.in_stock?"Mark sold out":"Back in stock");so.type="button";so.onclick=()=>{api("rpc/shop_save_product",{p:Object.assign({},p,{in_stock:!p.in_stock})}).then(()=>{p.in_stock=!p.in_stock;render()}).catch(er=>alert(er.message))};
    const del=el("button","red","Delete");del.type="button";del.onclick=()=>{if(!confirm("Delete "+p.name+"?"))return;api("rpc/shop_delete_product",{p_id:p.id}).then(()=>{P=P.filter(x=>x!==p);render()}).catch(er=>alert(er.message))};
    ac.append(e,so,del);r.appendChild(ac);c.appendChild(r)});
  box.appendChild(c);
}
function shrink(file){return new Promise((res,rej)=>{const im=new Image();const u=URL.createObjectURL(file);im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error("Couldn't read photo")),"image/jpeg",.85)};im.onerror=()=>rej(new Error("Couldn't read photo"));im.src=u})}
function upload(file){return shrink(file).then(b=>token().then(t=>{const name=Date.now().toString(36)+Math.random().toString(36).slice(2,7)+".jpg";
  return fetch(BASE+"/storage/v1/object/shop-images/"+name,{method:"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:b}).then(r=>{if(!r.ok)throw new Error("Photo upload failed");return BASE+"/storage/v1/object/public/shop-images/"+name})}))}
function renderForm(box){
  const p=editing||{name:"",category:"Women",price:"",old_price:"",sizes:"",colors:"",description:"",images:[],in_stock:true,featured:true,sort:0};
  let imgs=(p.images||[]).slice();
  const c=el("div","card");c.appendChild(el("h3",null,editing?"Edit product":"Add a product"));
  const f=el("form");
  function fld(lbl,type,val,hint){const l=el("label",null,lbl);const i=type==="textarea"?el("textarea"):el("input");if(type!=="textarea")i.type=type;else i.rows=3;i.value=val==null?"":val;const id="i"+Math.random().toString(36).slice(2,7);i.id=id;l.htmlFor=id;f.append(l,i);if(hint)f.appendChild(el("div","hint",hint));return i}
  const nm=fld("Name","text",p.name);
  const cl=el("label",null,"Category");const cs=el("select");cs.id="cat";cl.htmlFor="cat";["Women","Men","Shoes","Baby","Bags","Accessories"].forEach(x=>{const o=el("option",null,x);o.value=x;if(x===p.category)o.selected=true;cs.appendChild(o)});f.append(cl,cs);
  const g=el("div","grid2");f.appendChild(g);const pr=fld("Price ("+(S.currency||"")+")","number",p.price);const op=fld("Old price (for a sale)","number",p.old_price);
  [[pr.previousSibling,pr],[op.previousSibling,op]].forEach(([l,i])=>{const d=el("div");d.append(l,i);g.appendChild(d)});pr.step=op.step="0.01";pr.min=op.min="0";pr.inputMode=op.inputMode="decimal";
  const sz=fld("Sizes","text",p.sizes,"Separate with commas, e.g. 38, 39, 40 or S, M, L");
  const co=fld("Colours","text",p.colors,"Optional. e.g. Black, Gold");
  const ds=fld("Description","textarea",p.description,"Optional. Fabric, fit, how to style it…");
  f.appendChild(el("label",null,"Photos"));const th=el("div","thumbs");f.appendChild(th);
  function drawThumbs(){th.textContent="";imgs.forEach((u,i)=>{const d=el("div");const im=el("img");im.src=u.startsWith("img/")?"/"+u:u;im.alt="";const x=el("button",null,"×");x.type="button";x.setAttribute("aria-label","Remove photo");x.onclick=()=>{imgs.splice(i,1);drawThumbs()};d.append(im,x);th.appendChild(d)})}
  drawThumbs();
  const fi=el("input");fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.marginTop="8px";fi.setAttribute("aria-label","Add photos");f.appendChild(fi);f.appendChild(el("div","hint","Take or choose up to 5 photos. The first one is the main picture."));
  const ist=el("label","chk");const ic=el("input");ic.type="checkbox";ic.checked=p.in_stock!==false;ist.append(ic,document.createTextNode("In stock"));f.appendChild(ist);
  const ftl=el("label","chk");const fc=el("input");fc.type="checkbox";fc.checked=!!p.featured;ftl.append(fc,document.createTextNode("Show as New (at the top of the shop)"));f.appendChild(ftl);
  const msg=el("p","msg");msg.setAttribute("role","status");
  const go=el("button",null,editing?"Save changes":"Add to shop");go.type="submit";go.style.marginTop="16px";f.append(go,msg);
  fi.onchange=()=>{const files=[...fi.files].slice(0,5-imgs.length);if(!files.length){msg.textContent="Max 5 photos.";return}go.disabled=true;msg.textContent="Uploading photos…";msg.className="msg";
    Promise.all(files.map(upload)).then(us=>{imgs=imgs.concat(us);drawThumbs();msg.textContent="Photos added.";msg.className="msg ok"}).catch(e=>{msg.textContent=e.message;msg.className="msg err"}).then(()=>{go.disabled=false;fi.value=""})};
  f.onsubmit=e=>{e.preventDefault();if(!nm.value.trim()){msg.textContent="Add a name.";msg.className="msg err";return}go.disabled=true;
    const body={id:editing?editing.id:"",name:nm.value.trim(),category:cs.value,price:pr.value,old_price:op.value,sizes:sz.value.trim(),colors:co.value.trim(),description:ds.value.trim(),images:imgs,in_stock:ic.checked,featured:fc.checked,sort:p.sort||0};
    api("rpc/shop_save_product",{p:body}).then(()=>api("shop_products?select=*&order=featured.desc,sort.asc,created_at.desc")).then(r=>{P=r||[];editing=null;tab="products";render()}).catch(er=>{go.disabled=false;msg.textContent=er.message;msg.className="msg err"})};
  if(editing){const cn=el("button","alt","Cancel");cn.type="button";cn.style.marginLeft="8px";cn.onclick=()=>{editing=null;tab="products";render()};go.after(cn)}
  c.appendChild(f);box.appendChild(c);
}
function renderVip(box){
  const c=el("div","card");
  if(!V.length){c.appendChild(el("p","empty","No VIP members yet. They join from the shop’s VIP form."));box.appendChild(c);return}
  const cp=el("button","alt","Copy all numbers");cp.type="button";cp.onclick=()=>{const t=V.map(v=>v.phone).join("\n");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="Copied!"}).catch(()=>prompt("Copy these numbers:",t))};c.appendChild(cp);
  c.appendChild(el("p","hint","Tip: paste them into a WhatsApp broadcast list to announce new arrivals."));
  V.forEach(v=>{const r=el("div","pr");const t=el("div","t");t.appendChild(el("b",null,v.name));t.appendChild(el("small",null,v.phone+(v.likes?" · "+v.likes:"")));r.appendChild(t);
    const w=el("a","btn","WhatsApp");w.href=wa(v.phone,"Hi "+v.name+", it's MummyK’s Trend! ");w.target="_blank";w.rel="noopener";const ac=el("div","acts");ac.appendChild(w);r.appendChild(ac);c.appendChild(r)});
  box.appendChild(c);
}
function renderSettings(box){
  const c=el("div","card");const f=el("form");
  const F=[["whatsapp","WhatsApp number for orders","tel","Country code, no + or spaces. e.g. 233241234567"],["currency","Currency","text","e.g. GH₵, ₦, $, £, ₺"],["announcement","Top banner","text","Leave empty to hide"],["payment","How customers pay","textarea","Shown after they order. e.g. MoMo 024 000 0000 (Name), or bank details"],["delivery","Delivery note","textarea",""],["phone","Phone (shown on Contact)","tel",""],["email","Email","email",""],["instagram","Instagram username","text",""],["tiktok","TikTok username","text",""],["address","Shop address","text",""],["hours","Opening hours","text","e.g. Mon–Sat, 9am–7pm"]];
  const ins={};
  F.forEach(([k,lbl,type,hint])=>{const l=el("label",null,lbl);const i=type==="textarea"?el("textarea"):el("input");if(type!=="textarea")i.type=type;else i.rows=2;i.value=S[k]||"";i.id="s_"+k;l.htmlFor=i.id;f.append(l,i);if(hint)f.appendChild(el("div","hint",hint));ins[k]=i});
  const msg=el("p","msg");const go=el("button",null,"Save settings");go.type="submit";go.style.marginTop="16px";f.append(go,msg);
  f.onsubmit=e=>{e.preventDefault();go.disabled=true;const v=Object.assign({},S);Object.keys(ins).forEach(k=>v[k]=ins[k].value.trim());v.whatsapp=v.whatsapp.replace(/\D/g,"");
    api("rpc/shop_set_setting",{p_key:"shop",p_value:v}).then(()=>{S=v;msg.textContent="Saved. The shop is updated.";msg.className="msg ok"}).catch(er=>{msg.textContent=er.message;msg.className="msg err"}).then(()=>{go.disabled=false})};
  c.appendChild(f);box.appendChild(c);
}
boot();
setInterval(()=>{if(SES&&tab==="orders"&&!document.hidden)api("rpc/shop_list_orders",{}).then(r=>{if(r&&r.length!==O.length){O=r;render()}}).catch(()=>{})},60000);
})();
</script>
